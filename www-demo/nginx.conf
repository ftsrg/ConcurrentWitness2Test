server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required for the Wasmer SDK's WASIX threads (real multithreading via
    # Web Workers + SharedArrayBuffer) in "Compile & Run" -- both headers
    # are needed to make the page cross-origin isolated, which is what
    # unlocks SharedArrayBuffer. "credentialless" (not "require-corp") is
    # deliberate: require-corp blocks any cross-origin subresource lacking
    # a Cross-Origin-Resource-Policy header, and that blocking is often
    # silent (Network tab only, no Console error) -- it broke Pyodide
    # loading here even though jsdelivr does send that header for the
    # files actually checked. credentialless still yields a cross-origin
    # isolated page without requiring every third-party response to opt in;
    # none of this app's cross-origin resources need credentials anyway.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # nginx's bundled mime.types has no .mjs entry (only .js); without this,
    # the Wasmer SDK's ES module files would be served as
    # application/octet-stream and rejected by the browser's module loader.
    # A regex location wins over the /vendor/ prefix location above, so its
    # headers are repeated here rather than inherited.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
